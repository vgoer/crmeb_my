services:
  # MySQL 数据库
  mysql:
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    container_name: crmeb_mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_log:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crmeb-net

  # Redis 缓存
  redis:
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    container_name: crmeb_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    ports:
      - "${REDIS_PORT:-63791}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crmeb-net

  # PHP-FPM + Workerman + 定时任务
  # 默认基于本地代码构建镜像（docker/php/Dockerfile），并挂载本地代码实现热更新
  phpfpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: crmeb-php:local
    container_name: crmeb_php
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST_IP: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-crmeb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmeb}
      REDIS_HOST_IP: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      APP_DEBUG: "true"
      DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - "9000:9000"
      - "40001:40001"
      - "40002:40002"
    working_dir: /var/www
    volumes:
      - ./crmeb:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crmeb-net

  # Nginx 反向代理
  nginx:
    image: ccr.ccs.tencentyun.com/crmebky_php/nginx:v1.29.6
    container_name: crmeb_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8011}:80"
    environment:
      TZ: Asia/Shanghai
    working_dir: /var/www
    volumes_from:
      - phpfpm
    volumes:
      - ./docker/nginx/vhost.conf:/etc/nginx/conf.d/default.conf
      - nginx_log:/etc/nginx/log
    depends_on:
      - phpfpm
    networks:
      - crmeb-net

networks:
  crmeb-net:
    driver: bridge

volumes:
  mysql_data:
  mysql_log:
  redis_data:
  nginx_log:
